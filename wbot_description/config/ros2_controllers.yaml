# ROS 2 controllers config for wbot simulation
controller_manager:
  ros__parameters:
    update_rate: 50   # Controller update rate (Hz)

    # Joint state broadcaster (publishes all joint states)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      ros__parameters: {}

    # Differential drive controller for left/right wheels
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
      ros__parameters:
        left_wheel_names: ['wheel_left_joint']
        right_wheel_names: ['wheel_right_joint']
        wheel_separation: 0.028        # distance between left & right wheel centers
        wheel_radius: 0.033            # radius of each wheel (m)
        cmd_vel_timeout: 0.5
        publish_rate: 50
        velocity_rolling_window_size: 2
        linear:
          x:
            has_velocity_limits: true
            max_velocity: 1.0
            min_velocity: -1.0
        angular:
          z:
            has_velocity_limits: true
            max_velocity: 1.0
            min_velocity: -1.0

    # Optional (casters just broadcast their states; no actuation)
    caster_front_joint_controller:
      type: joint_state_broadcaster/JointStateBroadcaster
      ros__parameters:
        joints: ['caster_front_joint']

    caster_rear_joint_controller:
      type: joint_state_broadcaster/JointStateBroadcaster
      ros__parameters:
        joints: ['caster_rear_joint']

# IMU is passive, no controller needed; it is handled via gazebo_ros_imu plugin
